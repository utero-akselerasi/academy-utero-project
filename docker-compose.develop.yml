name: website-academy-utero-develop

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPLOY_TARGET: develop
      secrets:
        - supabase_build_env
    container_name: utero_academy_develop_web
    restart: unless-stopped
    env_file:
      - ${DEVELOP_ENV_FILE:-.env.develop}
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
    extra_hosts:
      - "supabase.carubra.com:20.20.20.173"
    expose:
      - "3000"
    networks:
      - develop_network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: utero_academy_develop_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:9983:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - develop_network

secrets:
  supabase_build_env:
    file: ${DEVELOP_BUILD_ENV_FILE:-.env.develop.build}

networks:
  develop_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.253.88.0/24
