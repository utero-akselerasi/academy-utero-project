# Include inside the production server block only during an approved maintenance window.
# Exact-match health remains available; every other request returns static maintenance.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "maintenance\n";
}
location / {
    limit_except GET HEAD { deny all; }
    root /opt/academy-maintenance;
    try_files /maintenance.html =503;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "900" always;
}
error_page 403 404 405 500 502 503 504 /maintenance.html;
location = /maintenance.html {
    internal;
    root /opt/academy-maintenance;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "900" always;
}
