services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utero_academy_web
    restart: always
    # TIDAK ADA `ports:` di sini, dan itu disengaja.
    #
    # Sebelumnya `3000:3000` dipublikasikan ke host. Itu membuat aplikasi bisa
    # dihubungi langsung di port 3000, melewati nginx — dan karena itu melewati
    # Cloudflare juga. Konsekuensinya bukan cuma soal TLS: `nginx.conf` memakai
    # `$http_cf_connecting_ip` untuk menetapkan `X-Real-IP`, jadi permintaan yang
    # masuk lewat pintu samping tidak punya IP asli yang benar sama sekali.
    #
    # nginx tetap bisa menghubungi service ini lewat `utero_network` dengan nama
    # host `web` (`proxy_pass http://web:3000`); jaringan Docker internal tidak
    # butuh port yang dipublikasikan ke host.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    env_file:
      - .env
    networks:
      - utero_network
      - carubra-network
    # Liveness, bukan kesehatan dependensi: endpoint ini sengaja tidak menyentuh
    # database. Lihat catatan di app/api/health/route.ts.
    #
    # Dijalankan dengan `node -e` karena image runner-nya alpine tanpa curl/wget,
    # dan menambah paket hanya untuk healthcheck memperbesar permukaan image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # Build Next.js besar; start_period mencegah container di-restart berulang
      # sebelum sempat siap melayani.
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: utero_academy_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # `service_healthy`, bukan sekadar `depends_on: [web]`: yang terakhir hanya
      # menunggu container dibuat, bukan menunggu aplikasinya siap — jadi nginx
      # bisa mulai menyalurkan trafik ke proses yang masih boot.
      web:
        condition: service_healthy
    networks:
      - utero_network
      - carubra-network

networks:
  utero_network:
    driver: bridge
  carubra-network:
    external: true
